name: Check Upstream and Trigger Build

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时检查一次
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      actions: write 
      packages: read 
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Get upstream image digest
        id: upstream
        run: |
          UPSTREAM_IMAGE="ghcr.io/vanilla-os/vso:main"
          DIGEST=$(skopeo inspect --raw docker://${UPSTREAM_IMAGE} | sha256sum | cut -d' ' -f1)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Get previous saved digest (from cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: upstream-digest.txt
          key: upstream-digest-${{ github.repository }}
          restore-keys: |
            upstream-digest-${{ github.repository }}

      - name: Compare digests
        id: compare
        run: |
          NEW_DIGEST="${{ steps.upstream.outputs.digest }}"
          OLD_DIGEST=""
          if [ -f upstream-digest.txt ]; then
            OLD_DIGEST=$(cat upstream-digest.txt)
          fi
          if [ "$NEW_DIGEST" != "$OLD_DIGEST" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Upstream has changed: $OLD_DIGEST -> $NEW_DIGEST"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No change"
          fi

      - name: Save new digest for next run
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.digest }}" > upstream-digest.txt

  trigger-build:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Vib Build" --ref main